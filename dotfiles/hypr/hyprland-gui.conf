# Generated by HyprMod

decoration:rounding = 0
decoration:blur:popups = true
decoration:blur:size = 5
decoration:dim_around = 0.1
decoration:dim_inactive = true
decoration:dim_special = 0.1
decoration:dim_strength = 0.15
general:allow_tearing = true
general:border_size = 2
general:extend_border_grab_area = 5
general:gaps_in = 6
general:gaps_out = 12
general:resize_on_border = true
input:accel_profile = flat
input:follow_mouse = 2

# Monitors
env = GDK_SCALE,1
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia

monitor = DP-1, 1920x1080@143.85Hz, 3440x0, 1, transform, 3
monitor = DP-2, 3440x1440@144.00Hz, 0x0, 1, bitdepth, 10

# Workspace Rules
workspace = 1, monitor:DP-2
workspace = 2, monitor:DP-1
workspace = 3, monitor:DP-2, gapsout:0, gapsin:0, border:false, decorate:false

# Window Rules
windowrule = workspace special:scratchpad, match:class Bitwarden
windowrule = workspace 2, match:class vesktop
windowrule = workspace 2, match:class Spotify
windowrule = workspace 3, match:initial_class ^(steam_app_\d+|cs2|gamescope|steam_app_default|Albion-Online)$, fullscreen 1

# Keybinds
unbind = SUPER SHIFT, SLASH
bindd  = SUPER SHIFT, SLASH, Passwords, exec, omarchy-launch-or-focus bitwarden-desktop
unbind = SUPER SHIFT, D
bindd  = SUPER SHIFT, D, Discord, exec, omarchy-launch-or-focus vesktop
unbind = SUPER SHIFT, M
bindd  = SUPER SHIFT, M, Music, exec, omarchy-launch-or-focus spotify

exec-once = sleep 5; easyeffects --hide-window --service-mode
exec-once = sleep 5; nextcloud --background
exec-once = sleep 5; vesktop --start-minimized
exec-once = sleep 5; cryptomator
exec-once = sleep 5; steam --hidden
